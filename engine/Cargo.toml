[package]
name = "filo-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "filo's transfer engine (SFTP data path)"

[dependencies]
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "sync", "time"] }
anyhow = "1"
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
